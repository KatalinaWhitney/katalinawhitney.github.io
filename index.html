  <script>
    function updateClock() {
      const now = new Date();
      const clock = document.getElementById("clock");

      clock.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
      clock.dateTime = now.toISOString();
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
